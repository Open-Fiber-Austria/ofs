# An action to build a new version of the documentation
name: Build Documentation
description: |
  Try to build a new version of the documentation by using the zensical tool.
  Pipeline will fail in case of syntax errors.
author: Daniel Hofstetter<dh@yio.at>
runs:
  using: "composite"
  steps:
    # simply take the zensical tool to build a new documentation
    #  (static content) to check if syntax is correct.
    - run: zensical build --clean
      shell: bash
